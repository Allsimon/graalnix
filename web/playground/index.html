<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graalnix playground</title>
<style>
:root { color-scheme: light dark; --border: #8884; --muted: #888; --error: #d33; --warning: #c80; --hint: #38c; }
.keyword { color: light-dark(#a626a4, #c678dd); }
.string { color: light-dark(#50a14f, #98c379); }
.escape { color: light-dark(#c18401, #e5c07b); }
.interp { color: light-dark(#e45649, #e06c75); }
.number, .constant { color: light-dark(#986801, #d19a66); }
.path { color: light-dark(#0184bc, #56b6c2); }
.comment { color: light-dark(#a0a1a7, #7f848e); font-style: italic; }
.builtin { color: light-dark(#ca1243, #be5046); }
.attr { color: light-dark(#4078f2, #61afef); }
.param { font-style: italic; }
.operator { color: light-dark(#696c77, #9da5b4); }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: .75em 1.25em; padding: .6em 1em; border-bottom: 1px solid var(--border); }
header h1 { font-size: 1.05em; margin: 0 .5em 0 0; }
header label { display: flex; align-items: center; gap: .35em; }
header input[type=number] { width: 4.5em; }
#status { color: var(--muted); margin-left: auto; }
main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
section { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
section + section { border-left: 1px solid var(--border); }
h2 { margin: 0; padding: .3em 1em; font-size: .85em; font-weight: normal; color: var(--muted); border-bottom: 1px solid var(--border); }
textarea, #output { width: 100%; height: 100%; border: 0; padding: 1em; resize: none; font: 14px/1.45 ui-monospace, monospace; tab-size: 2; outline: none; background: transparent; color: inherit; white-space: pre; }
#source { color: transparent; caret-color: CanvasText; }
#source::selection { color: transparent; background: #38f5; }
#output { margin: 0; overflow: auto; }
.editor { position: relative; min-height: 0; }
.editor textarea, #marks { position: absolute; inset: 0; margin: 0; }
#marks { padding: 1em calc(1em + 20px) 1em 1em; font: 14px/1.45 ui-monospace, monospace; tab-size: 2; white-space: pre; overflow: hidden; pointer-events: none; }
mark { background: none; color: inherit; text-decoration: underline wavy; text-decoration-skip-ink: none; text-underline-offset: 3px; }
mark.error { text-decoration-color: var(--error); }
mark.warning { text-decoration-color: var(--warning); }
mark.hint { text-decoration: underline dotted var(--hint) 2px; }
#output.failed { color: var(--error); white-space: pre-wrap; }
#findings { margin: 0; padding: .4em 0; list-style: none; max-height: 30vh; overflow: auto; border-top: 1px solid var(--border); font-size: 14px; }
#findings li { padding: .2em 1em; cursor: pointer; }
#findings li:hover { background: #8882; }
#findings .where { font-family: ui-monospace, monospace; color: var(--muted); }
#findings .error { color: var(--error); }
#findings .warning { color: var(--warning); }
#findings .hint { color: var(--hint); }
#findings .rule { font-family: ui-monospace, monospace; }
#findings .none { color: var(--muted); cursor: default; }
#findings .none:hover { background: none; }
@media (max-width: 800px) {
  main { grid-template-columns: none; grid-template-rows: 1fr 1fr; }
  section + section { border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<header>
  <h1>graalnix playground</h1>
  <label title="Format, as nixfmt does"><input type="radio" name="mode" value="format"> Format</label>
  <label title="Apply the linter's fixes, then format"><input type="radio" name="mode" value="fix" checked> Fix</label>
  <label>Width <input id="width" type="number" min="20" max="400" value="100"></label>
  <label>Indent <input id="indent" type="number" min="1" max="16" value="2"></label>
  <label><input id="strict" type="checkbox"> Strict</label>
  <span id="status"></span>
</header>
<main>
  <section>
    <h2>Input</h2>
    <!-- pkgs/by-name/kc/kcgi/package.nix of nixpkgs 718f670e845328e9c2cecdd832835712b2cbd065 -->
    <div class="editor">
    <pre id="marks" aria-hidden="true"></pre>
    <textarea id="source" spellcheck="false" aria-label="Nix source">{
  lib,
  stdenv,
  pkg-config,
  fetchFromGitHub,
  libbsd,
}:

stdenv.mkDerivation rec {
  pname = "kcgi";
  version = "0.10.8";
  underscoreVersion = lib.replaceStrings [ "." ] [ "_" ] version;

  src = fetchFromGitHub {
    owner = "kristapsdz";
    repo = "kcgi";
    rev = "VERSION_${underscoreVersion}";
    sha256 = "0ha6r7bcgf6pcn5gbd2sl7835givhda1jql49c232f1iair1yqyp";
  };
  patchPhase = ''
    substituteInPlace configure \
      --replace /usr/local /
  '';

  nativeBuildInputs = [ pkg-config ];
  buildInputs = [ ] ++ lib.optionals stdenv.hostPlatform.isLinux [ libbsd ];

  dontAddPrefix = true;

  installFlags = [ "DESTDIR=$(out)" ];

  meta = {
    broken = (stdenv.hostPlatform.isLinux &amp;&amp; stdenv.hostPlatform.isAarch64);
    homepage = "https://kristaps.bsd.lv/kcgi";
    description = "Minimal CGI and FastCGI library for C/C++";
    license = lib.licenses.isc;
    platforms = lib.platforms.all;
    mainProgram = "kfcgi";
  };
}
</textarea>
    </div>
  </section>
  <section>
    <h2 id="title">Fixed and formatted</h2>
    <pre id="output" tabindex="0" aria-live="polite"></pre>
  </section>
</main>
<ul id="findings" aria-live="polite"></ul>
<script src="graalnix.js"></script>
<script>
"use strict";
const source = document.getElementById("source");
const output = document.getElementById("output");
const marks = document.getElementById("marks");
const findings = document.getElementById("findings");
const status = document.getElementById("status");
const controls = document.querySelectorAll("header input");
const mode = () => document.querySelector("input[name=mode]:checked").value;
const options = () => [
  Number(document.getElementById("width").value) || 100,
  Number(document.getElementById("indent").value) || 2,
  document.getElementById("strict").checked,
];

function position(text, offset) {
  const before = text.slice(0, offset);
  const line = before.split("\n").length;
  return line + ":" + (offset - before.lastIndexOf("\n"));
}

function select(start, end) {
  source.focus();
  source.setSelectionRange(start, Math.max(start, end));
  const line = source.value.slice(0, start).split("\n").length - 1;
  const height = source.scrollHeight / source.value.split("\n").length;
  source.scrollTop = Math.max(0, line * height - source.clientHeight / 3);
}

function item(className, text, start, end) {
  const li = document.createElement("li");
  li.className = className;
  li.append(...text);
  if (start !== undefined) li.addEventListener("click", () => select(start, end));
  return li;
}

function span(className, text) {
  const s = document.createElement("span");
  s.className = className;
  s.textContent = text;
  return s;
}

const RANK = { hint: 1, warning: 2, error: 3 };

let diagnostics = [];

function tokensOf(text) {
  return JSON.parse(self.highlight(text)).tokens ?? [];
}

function paint(target, text, tokens, diagnostics) {
  const ranges = diagnostics.map(d => {
    let { start, end } = d;
    if (end <= start) {
      if (start >= text.length || text[start] === "\n") start = Math.max(0, start - 1);
      end = start + 1;
    }
    return { start, end, severity: d.severity };
  });
  const cuts = [...new Set([0, text.length, ...tokens.flatMap(t => [t[0], t[1]]), ...ranges.flatMap(r => [r.start, r.end])])]
    .filter(i => i <= text.length).sort((a, b) => a - b);
  const parts = [];
  let t = 0;
  for (let i = 0; i + 1 < cuts.length; i++) {
    const [from, to] = [cuts[i], cuts[i + 1]];
    while (t < tokens.length && tokens[t][1] <= from) t++;
    const kind = t < tokens.length && tokens[t][0] <= from ? tokens[t][2] : null;
    const severity = ranges.filter(r => r.start <= from && to <= r.end)
      .reduce((worst, r) => !worst || RANK[r.severity] > RANK[worst] ? r.severity : worst, null);
    let part = text.slice(from, to);
    if (kind) part = span(kind, part);
    if (severity) {
      const mark = document.createElement("mark");
      mark.className = severity;
      mark.append(part);
      part = mark;
    }
    parts.push(part);
  }
  target.replaceChildren(...parts);
}

function showMarks() {
  const text = source.value;
  paint(marks, text, tokensOf(text), diagnostics);
  // Extra lines let the backdrop scroll as far as the textarea, whose horizontal scrollbar takes height.
  marks.append("\n\n\n");
  syncScroll();
}

function syncScroll() {
  marks.scrollTop = source.scrollTop;
  marks.scrollLeft = source.scrollLeft;
}

function showFindings(text) {
  const result = JSON.parse(self.lint(text));
  diagnostics = result.diagnostics ?? [];
  showMarks();
  findings.replaceChildren();
  if (result.error) {
    findings.append(item("error", [result.error.message]));
  } else if (result.diagnostics.length === 0) {
    findings.append(item("none", ["No findings."]));
  } else {
    for (const d of result.diagnostics) {
      findings.append(item("", [
        span("where", position(text, d.start) + " "),
        span(d.severity, d.severity),
        span("rule", "[" + d.rule + "] "),
        d.message + (d.fixable ? " (fixable)" : ""),
      ], d.start, d.end));
    }
  }
}

function showOutput(text) {
  const name = mode();
  document.getElementById("title").textContent = name === "fix" ? "Fixed and formatted" : "Formatted";
  const result = JSON.parse(self[name](text, ...options()));
  output.classList.toggle("failed", Boolean(result.error));
  if (result.error) output.textContent = position(text, result.error.start) + ": " + result.error.message;
  else paint(output, result.output, tokensOf(result.output), []);
}

function refresh() {
  const text = source.value;
  const started = performance.now();
  showOutput(text);
  showFindings(text);
  status.textContent = "in " + Math.round(performance.now() - started) + " ms";
}

let pending;
source.addEventListener("input", () => {
  showMarks();
  clearTimeout(pending);
  pending = setTimeout(refresh, 150);
});
source.addEventListener("scroll", syncScroll);
new ResizeObserver(syncScroll).observe(source);
for (const control of controls) control.addEventListener("input", refresh);
refresh();
</script>
</body>
</html>
