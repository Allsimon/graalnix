# symlink-resolution/broken dangles on purpose, which Jenesis refuses among sources; LangTest recreates it from lang-symlinks.txt.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: language/src/test/java/lang
    contents:
      - path: .
        git:
          url: https://github.com/NixOS/nix
          ref: 2.34.9
          depth: 1
        includePaths:
          - tests/functional/lang/**/*
        excludePaths:
          - tests/functional/lang/symlink-resolution/broken
        newRootPath: tests/functional/lang
  - path: language/src/test/java/tvix
    contents:
      - path: .
        git:
          url: https://github.com/tvlfyi/tvix
          ref: 259a1617ef482482d3425d74502822ac58c4d024
          depth: 1
        includePaths:
          - eval/src/tests/tvix_tests/**/*
        # identity-* tests expect their own source back, which the harness does not check.
        excludePaths:
          - eval/src/tests/tvix_tests/notyetpassing/**/*
          - eval/src/tests/tvix_tests/identity-*
          - eval/src/tests/tvix_tests/README.md
        newRootPath: eval/src/tests/tvix_tests
  - path: format/src/test/java/nixfmt
    contents:
      - path: .
        git:
          url: https://github.com/NixOS/nixfmt
          ref: v1.5.0
          depth: 1
        includePaths:
          - test/correct/**/*
          - test/correct-indent-4.nix
          - test/diff/**/*
          - test/invalid/**/*
        newRootPath: test
