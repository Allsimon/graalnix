# symlink-resolution/broken dangles on purpose, which Jenesis refuses among sources; LangTest recreates it from lang-symlinks.txt.
apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: language/src/test/java/lang
    contents:
      - path: .
        git:
          url: https://github.com/NixOS/nix
          ref: 2.34.9
          depth: 1
        includePaths:
          - tests/functional/lang/**/*
        excludePaths:
          - tests/functional/lang/symlink-resolution/broken
        newRootPath: tests/functional/lang
