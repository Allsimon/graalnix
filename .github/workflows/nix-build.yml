name: Nix build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#nix-fast-build -- --no-nom --skip-cached --no-link
      - run: nix build .#checks.x86_64-linux.tests --out-link coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
